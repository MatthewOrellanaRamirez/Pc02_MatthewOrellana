<div class="contenedor">
  <h2>Reporte de Estudiantes</h2>

  <div *ngIf="cargando">Cargando datos...</div>
  <div *ngIf="errorMensaje" class="error">{{ errorMensaje }}</div>

  <table *ngIf="!cargando && !errorMensaje" class="tabla-estudiantes">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Nota 1</th>
        <th>Nota 2</th>
        <th>Nota 3</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of listaEstudiantes">
        <td>{{ item.nombre }}</td>
        <td>{{ item.nota1 }}</td>
        <td>{{ item.nota2 }}</td>
        <td>{{ item.nota3 }}</td>
        <td>
          <a [routerLink]="['/detalle', item.id]">
            <button class="btn-detalle">Detalle</button>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
